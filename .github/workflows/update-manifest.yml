name: Auto Update Manifest

on:
  push:
    paths:
      - 'docs/**'              # docs 폴더 내 마크다운 추가/수정 시 실행
      - 'generate_manifest.py' # 스크립트 자체 수정 시에도 자동 실행
    branches:
      - main                  # 기본 브랜치
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼 활성화

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 커밋 및 푸시 권한
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 리베이스 충돌 방지를 위한 전체 커밋 히스토리 로드

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: manifest.json 생성
        run: python generate_manifest.py

      - name: 변경 사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --staged --quiet; then
            echo "manifest.json 변경 사항 없음"
          else
            git commit -m "docs: manifest.json 자동 갱신 [skip ci]"
            git pull --rebase origin main
            git push
          fi
